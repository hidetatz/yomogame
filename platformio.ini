; https://github.com/sivar2311/ESP32-PlatformIO-Flash-and-PSRAM-configurations

; Flash: 16MB QD, PSRAM: 8MB OT
[env:esp32-s3-devkitc-1]

; expressif 6.7.0 or newer depends on esp32-s3 Arduino core 2.0.14<, but
; they does not work with TFT_eSPI 
; https://github.com/Bodmer/TFT_eSPI/issues/3329
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

lib_deps =
  adafruit/Adafruit NeoPixel
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  TFT_eSPI
    
build_flags =
  # TFT_eSPI
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_CS=10
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_MISO=-1
  -D TFT_DC=14
  -D TFT_RST=38
  -D SPI_FREQUENCY=60000000
  -std=gnu++17

build_unflags = -std=gnu++11

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.extra_flags = 
  # PSRAM
  -DBOARD_HAS_PSRAM

