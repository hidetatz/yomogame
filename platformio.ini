; https://github.com/sivar2311/ESP32-PlatformIO-Flash-and-PSRAM-configurations

; Flash: 16MB QD, PSRAM: 8MB OT
[env:esp32-s3-devkitc-1]

; expressif 6.7.0 or newer depends on esp32-s3 Arduino core 2.0.14<, but
; they does not work with TFT_eSPI 
; https://github.com/Bodmer/TFT_eSPI/issues/3329
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

lib_deps =
  adafruit/Adafruit NeoPixel
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  TFT_eSPI
    
build_flags =
  # TFT_eSPI
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_CS=10
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_DC=14
  -D TFT_RST=38
  # TFT is write-only, but the shared SPI bus needs a MISO line for the SD card.
  -D TFT_MISO=42
  -D SPI_FREQUENCY=60000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -std=gnu++17
  # emulator cores
  -I src/nes
  -I src/gb
  -D MINIGB_APU_AUDIO_FORMAT_S16SYS
  -D AUDIO_SAMPLE_RATE=22050
  # Peanut-GB: drop the slow high-accuracy renderer and the 12-bit colour path
  # (we only use the 2-bit shade / CGB's own palette). Must match between
  # gb_core.c and gb_scene.h.
  -D PEANUT_GB_HIGH_LCD_ACCURACY=0
  -D PEANUT_GB_12_COLOUR=0
  # Game Boy Color support (from Peanut-GB's upstream cgb branch, PR #93,
  # merged onto our current master vendor drop). Must match between
  # gb_core.c and gb_scene.h.
  -D PEANUT_FULL_GBC_SUPPORT=1
  # emulator hot loops opt in per-file via #pragma GCC optimize; the rest of the
  # project (tetris, audio engine) stays at the framework default.

build_unflags = -std=gnu++11

board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_build.extra_flags = 
  # PSRAM
  -DBOARD_HAS_PSRAM

